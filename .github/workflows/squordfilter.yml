name: SquordFilter wasm

on:
  push:
    branches: ['squordfilter/**']
    tags: ['squordfilter-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.98.1'
  WASM_PACK_VERSION: 'v0.15.0'
  WASM_PACK_SHA256: 'c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        run: |
          name="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o wasm-pack.tar.gz "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/${name}.tar.gz"
          echo "${WASM_PACK_SHA256}  wasm-pack.tar.gz" | sha256sum -c -
          tar xzf wasm-pack.tar.gz
          install -m 755 "${name}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"

      - name: Build the wasm
        env:
          RUSTFLAGS: '-C target-feature=+simd128 --cfg getrandom_backend="wasm_js"'
        run: wasm-pack build libDF --target web --release -- --features wasm --no-default-features

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the voice survives
        run: node squord/verify.mjs libDF/pkg

      - name: Package
        run: |
          mkdir dist
          gzip -9 -n -c libDF/pkg/df_bg.wasm > dist/squordfilter_bg.wasm.gz
          cp LICENSE-MIT LICENSE-APACHE NOTICE-SQUORD.md dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: squordfilter
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/squordfilter-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: squordfilter
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SquordFilter ${GITHUB_REF_NAME#squordfilter-v}" \
            --notes "DeepFilterNet3 wasm for Squord, with local-SNR thresholds -10/30/30. See NOTICE-SQUORD.md for attribution and changes."
